<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="avatarBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#262626" />
      <stop offset="70%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="giGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="redBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.1" />
      <stop offset="0%" stop-color="#e2b490" />
      <stop offset="100%" stop-color="#c48a60" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="150" cy="150" r="148" fill="url(#avatarBg)" stroke="url(#goldRim)" stroke-width="4" />

  <!-- Master Silhouette with Black Gi -->
  <g id="masterFigure">
    <!-- Black Gi Shoulders & Chest -->
    <path d="M 40,300 C 45,220 75,185 110,175 L 150,225 L 190,175 C 225,185 255,220 260,300 Z" fill="url(#giGrad)" stroke="#27272a" stroke-width="2" />
    
    <!-- Lapels (Gola do Kimono) -->
    <!-- Left Lapel -->
    <path d="M 110,175 L 150,235 L 132,300 L 95,300 Z" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
    <!-- Right Lapel Crossing Over (Tradicional) -->
    <path d="M 190,175 L 140,240 L 168,300 L 205,300 Z" fill="#27272a" stroke="#52525b" stroke-width="2" />

    <!-- Red Bar & Black Belt with 5 Degrees Across Chest/Waist -->
    <g transform="translate(150, 275)">
      <!-- Black Belt -->
      <rect x="-80" y="-12" width="160" height="24" rx="3" fill="#050505" stroke="url(#goldRim)" stroke-width="1.5" />
      <!-- Red Bar (Ponteira de Mestre) -->
      <rect x="15" y="-10" width="55" height="20" rx="2" fill="url(#redBar)" stroke="#ffffff" stroke-width="0.8" />
      <!-- 5 White Stripes (5º Grau) -->
      <rect x="20" y="-8" width="4" height="16" fill="#ffffff" />
      <rect x="27" y="-8" width="4" height="16" fill="#ffffff" />
      <rect x="34" y="-8" width="4" height="16" fill="#ffffff" />
      <rect x="41" y="-8" width="4" height="16" fill="#ffffff" />
      <rect x="48" y="-8" width="4" height="16" fill="#ffffff" />
      <!-- Kanji 柔術 on Belt -->
      <text x="-35" y="4" text-anchor="middle" font-size="10" font-weight="900" fill="url(#goldRim)">5º GRAU</text>
    </g>

    <!-- Neck -->
    <path d="M 130,140 L 130,185 L 170,185 L 170,140 Z" fill="url(#skinGrad)" />

    <!-- Head & Face -->
    <ellipse cx="150" cy="115" rx="42" ry="48" fill="url(#skinGrad)" />

    <!-- Hair / Short Trim & Beard (Distinguished Master) -->
    <!-- Hair -->
    <path d="M 108,105 C 108,70 125,58 150,58 C 175,58 192,70 192,105 C 185,75 168,68 150,68 C 132,68 115,75 108,105 Z" fill="#1c1917" />
    <!-- Beard Trim -->
    <path d="M 116,115 C 118,145 130,165 150,165 C 170,165 182,145 184,115 C 180,148 168,158 150,158 C 132,158 120,148 116,115 Z" fill="#1c1917" opacity="0.9" />

    <!-- Eyes (Focused Martial Gaze) -->
    <ellipse cx="136" cy="112" rx="4.5" ry="2.5" fill="#1c1917" />
    <ellipse cx="164" cy="112" rx="4.5" ry="2.5" fill="#1c1917" />
    <path d="M 128,106 Q 136,103 144,107" stroke="#1c1917" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 156,107 Q 164,103 172,106" stroke="#1c1917" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Nose & Mouth -->
    <path d="M 150,112 L 148,126 L 153,127" stroke="#9a3412" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <path d="M 142,138 Q 150,140 158,138" stroke="#78350f" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>

  <!-- Team Spakauskas Patch on Gi Chest -->
  <g transform="translate(112, 218) scale(0.28)">
    <circle cx="0" cy="0" r="38" fill="#000000" stroke="url(#goldRim)" stroke-width="3" />
    <text x="0" y="5" text-anchor="middle" font-size="16" font-weight="900" fill="#f59e0b">SPAK</text>
  </g>

  <!-- Golden 5-Star Rank Arch Above Head -->
  <g fill="url(#goldRim)" transform="translate(150, 42)">
    <polygon points="0,-7 2,-2 7,-2 3,1 4,6 0,3 -4,6 -3,1 -7,-2 -2,-2" transform="translate(0, 0) scale(1.1)" />
    <polygon points="0,-7 2,-2 7,-2 3,1 4,6 0,3 -4,6 -3,1 -7,-2 -2,-2" transform="translate(-18, 3) scale(0.9)" />
    <polygon points="0,-7 2,-2 7,-2 3,1 4,6 0,3 -4,6 -3,1 -7,-2 -2,-2" transform="translate(18, 3) scale(0.9)" />
    <polygon points="0,-7 2,-2 7,-2 3,1 4,6 0,3 -4,6 -3,1 -7,-2 -2,-2" transform="translate(-34, 9) scale(0.75)" />
    <polygon points="0,-7 2,-2 7,-2 3,1 4,6 0,3 -4,6 -3,1 -7,-2 -2,-2" transform="translate(34, 9) scale(0.75)" />
  </g>
</svg>